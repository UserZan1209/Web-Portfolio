      <div class="slideshow-container">
        <div class="slide active">
          <img class="game-Box-Image-Style" src="../images/Deadend.png">
        </div>
        <div class="slide">
          <img class="game-Box-Image-Style" src="../images/Deadend1.png">
        </div>
        <div class="slide">
          <img class="game-Box-Image-Style" src="../images/Deadend2.png">
        </div>
      </div>

      <button class="default-button" onclick="prevSlide()">Previous</button>
      <button class="default-button" onclick="nextSlide()">Next</button>

      <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function showSlide(index) {
          slides.forEach(slide => slide.classList.remove('active'));
          slides[index].classList.add('active');
        }

        function nextSlide() {
          currentSlide = (currentSlide + 1) % slides.length;
          showSlide(currentSlide);
        }

        function prevSlide() {
          currentSlide = (currentSlide - 1 + slides.length) % slides.length;
          showSlide(currentSlide);
        }

        // Auto-slide every 3 seconds
        setInterval(nextSlide, 3000);
      </script>


    </body>
